<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rupendra Food Delivery App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        .header {
            background-color: #ff5722;
            color: white;
            padding: 20px;
        }

        .restaurant {
            background-color: white;
            width: 300px;
            margin: 25px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .restaurant h2 {
            color: #ff5722;
        }

        button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e64a19;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>RUPENDRA Food Delivery App</h1>
        <p>Choose Your Restaurant</p>
    </div>

    <div class="restaurant">
        <h2>Spicy Kitchen</h2>
        <p>Indian - Biryani - Fast Food</p>

        <button onclick="window.location.href='spicy-menu.html'">
            View Menu
        </button>
    </div>

    <div class="restaurant">
        <h2>Food Hub</h2>
        <p>Pizza - Burger - Fast Food</p>

        <button onclick="window.location.href='food.html'">
            View Menu
        </button>
    </div>

</body>
</html>
