<!DOCTYPE html>
<html>
<head>
    <title>Rupendra - Restaurants</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 40px;
            text-align: center;
        }

        .restaurant {
            background-color: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .restaurant h2 {
            color: #ff5722;
        }

        button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e64a19;
        }

        .back {
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>RUPENDRA Food Delivery App</h1>
    </div>

    <div class="container">

        <h2>Available Restaurants</h2>

        <div class="restaurant">
            <h2>Spicy Kitchen</h2>
            <p>Indian - Biryani - Fast Food</p>

            <button onclick="window.location.href='spicy-menu.html'">
                View Menu
            </button>
        </div>

        <div class="restaurant">
            <h2>Food Hub</h2>
            <p>Pizza - Burger - Fast Food</p>

            <button onclick="window.location.href='food.html'">
                View Menu
            </button>
        </div>

        <div class="back">
            <button onclick="window.location.href='index.html'">
                Back to Home
            </button>
        </div>

    </div>

</body>
</html>
