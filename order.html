<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Place Order</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 400px;
            max-width: 85%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            text-align: center;
            color: #ff5722;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background-color: #ff5722;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>RUPENDRA Food Delivery App</h1>
    </div>

    <div class="container">

        <h2>Place Your Order</h2>

        <label>Food Name</label>
        <input type="text" id="foodName" readonly>

        <label>Price (Rs.)</label>
        <input type="text" id="price" readonly>

        <label>Quantity</label>
        <input type="number" id="quantity"
               value="1" min="1" oninput="updateTotal()">

        <label>Total Price (Rs.)</label>
        <input type="text" id="total" readonly>

        <label>Customer Name</label>
        <input type="text" id="customerName"
               placeholder="Enter your name">

        <label>Delivery Address</label>
        <input type="text" id="address"
               placeholder="Enter delivery address">

        <button onclick="placeOrder()">Place Order</button>

        <button class="back"
                onclick="window.location.href='food.html'">
            Back to Menu
        </button>

    </div>

    <script>
        let foods = {
            "1": { name: "Chicken Biryani", price: 250 },
            "2": { name: "Veg Biryani", price: 220 },
            "3": { name: "Veg Pizza", price: 200 },
            "4": { name: "Burger", price: 150 }
        };

        let params = new URLSearchParams(window.location.search);
        let foodId = params.get("foodId");
        let food = foods[foodId];

        if (food) {
            document.getElementById("foodName").value = food.name;
            document.getElementById("price").value = food.price;
        } else {
            document.getElementById("foodName").value =
                "Food not selected";
            document.getElementById("price").value = 0;
        }

        updateTotal();

        function updateTotal() {
            let price = Number(
                document.getElementById("price").value
            );

            let quantity = Number(
                document.getElementById("quantity").value
            );

            document.getElementById("total").value =
                quantity >= 1 && Number.isInteger(quantity)
                ? price * quantity
                : "Invalid quantity";
        }

        function placeOrder() {
            let customerName =
                document.getElementById("customerName").value.trim();

            let address =
                document.getElementById("address").value.trim();

            let quantity =
                Number(document.getElementById("quantity").value);

            if (!food) {
                alert("Please select a food item from the menu.");
                return;
            }

            if (customerName === "" || address === "") {
                alert("Please enter your name and delivery address.");
                return;
            }

            if (!Number.isInteger(quantity) || quantity < 1) {
                alert("Please enter a valid quantity.");
                return;
            }

            alert(
                "Order Placed Successfully!\n" +
                "Food: " + food.name + "\n" +
                "Price: Rs. " + food.price + "\n" +
                "Quantity: " + quantity + "\n" +
                "Total: Rs. " + (food.price * quantity)
            );
        }
    </script>

</body>
</html>
