<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Place Order</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 400px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            text-align: center;
            color: #ff5722;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background-color: #ff5722;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e64a19;
        }

        .back {
            background-color: #555;
        }

        .back:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>RUPENDRA Food Delivery App</h1>
    </div>

    <div class="container">

        <h2>Place Your Order</h2>

        <label>Food Name</label>
        <input type="text" id="foodName" value="Chicken Biryani">

        <label>Price</label>
        <input type="text" id="price" value="250">

        <label>Quantity</label>
        <input type="number" id="quantity" value="1" min="1">

        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="Enter your name">

        <label>Delivery Address</label>
        <input type="text" id="address" placeholder="Enter delivery address">

        <button onclick="placeOrder()">
            Place Order
        </button>

        <button class="back" onclick="window.location.href='spicy-menu.html'">
            Back to Menu
        </button>

    </div>

    <script>
        function placeOrder() {

            let customerName = document.getElementById("customerName").value;
            let address = document.getElementById("address").value;

            if (customerName === "" || address === "") {
                alert("Please enter Customer Name and Delivery Address.");
                return;
            }

            alert("Order Placed Successfully!");
        }
    </script>

</body>
</html>
