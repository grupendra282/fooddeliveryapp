<!DOCTYPE html>

<html>
<head>
    <title>Spicy Kitchen Menu</title>

```
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    .header {
        background-color: #ff5722;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .header h1 {
        margin: 0;
    }

    .container {
        padding: 40px;
        text-align: center;
    }

    .food {
        background-color: white;
        width: 320px;
        margin: 20px auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px #ccc;
    }

    .food h2 {
        color: #ff5722;
    }

    .price {
        font-size: 20px;
        font-weight: bold;
        color: #333;
    }

    button {
        background-color: #ff5722;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background-color: #e64a19;
    }

    .back {
        margin-top: 30px;
    }
</style>
```

</head>

<body>

```
<div class="header">
    <h1>RUPENDRA Food Delivery App</h1>
</div>

<div class="container">

    <h2>Spicy Kitchen Menu</h2>

    <!-- Chicken Biryani -->
    <div class="food">
        <h2>Chicken Biryani</h2>
        <p>Delicious Chicken Biryani</p>
        <p class="price">Rs. 250</p>

        <button onclick="window.location.href='order.html?foodId=1'">
            Order Now
        </button>
    </div>

    <!-- Paneer Biryani -->
    <div class="food">
        <h2>Paneer Biryani</h2>
        <p>Special Paneer Biryani</p>
        <p class="price">Rs. 220</p>

        <button onclick="window.location.href='order.html?foodId=2'">
            Order Now
        </button>
    </div>

    <!-- Back Button -->
    <div class="back">
        <button onclick="window.location.href='restaurants.html'">
            Back to Restaurants
        </button>
    </div>

</div>


</body>
</html>
